#
# git-cliff configuration: `CHANGELOG.md` is generated from the Conventional Commits on main,
# grouped as in docs/conventions/commits.md §2 and docs/conventions/versioning.md §4.
# Generate with: git cliff -o CHANGELOG.md

[changelog]
header = """
# Changelog

Generated by git-cliff from Conventional Commits on `main` (docs/conventions/versioning.md §4).
Hand-written release notes may add context on top, never replace this list.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Commits from before the conventions (e.g. the initial commit) are left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only order the groups; `striptags` removes them from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = "^docs\\(adr\\)", group = "<!-- 4 -->Documentation" },
  { message = ".*", skip = true },
]
