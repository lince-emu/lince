# cargo-deny configuration (DEV-81, ADR-0026).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Licenses compatible with GPL-3.0-or-later distribution (ADR-0000).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "tokio", reason = "no general-purpose async runtime in emulation crates (ADR-0017); tools must justify it" },
  { crate = "async-std", reason = "ADR-0017" },
  { crate = "openssl-sys", reason = "C dependency; requires an ADR-0026 exception" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
