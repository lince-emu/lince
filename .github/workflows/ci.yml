# Runs `cargo xtask ci` on every supported host (ADR-0002, ADR-0003).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the commit-message check can walk the pull request's commits.
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # C++ checks (ADR-0030, ARCH-54) need clang, clang-format, clang-tidy, and libclang for
      # bindgen. The Windows image ships LLVM in C:\Program Files\LLVM, which xtask finds.
      - name: Install LLVM tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang clang-format clang-tidy libclang-dev
      - name: Show the clang version used
        shell: bash
        run: clang --version || "C:/Program Files/LLVM/bin/clang.exe" --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: cargo xtask ci
        shell: bash
        # Event fields reach the script only as environment variables, never interpolated
        # into it, so a pull-request title cannot inject shell code.
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -n "$BASE_REF" ]; then
            cargo xtask ci --base "origin/$BASE_REF" --pr-title "$PR_TITLE"
          else
            cargo xtask ci
          fi
      # PoC-11 lives outside the workspace; its Rust tests and the check that the checked-in
      # bindings match the C header run here (T-026).
      - name: PoC-11 tests and bindings check
        shell: bash
        working-directory: poc/cpp-boundary
        run: |
          cargo test --locked
          cargo run --locked --features regen --bin regen_bindings -- --check
