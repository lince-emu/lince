[package]
name = "lince-app"
description = "Lince frontend: the `lince` command line"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lince"
path = "src/main.rs"

[dependencies]
lince-common = { path = "../lince-common", version = "0.0.0" }
lince-cpu-a64 = { path = "../lince-cpu-a64", version = "0.0.0" }
lince-kernel = { path = "../lince-kernel", version = "0.0.0" }
lince-loader = { path = "../lince-loader", version = "0.0.0" }
lince-mem = { path = "../lince-mem", version = "0.0.0" }
lince-trace = { path = "../lince-trace", version = "0.0.0" }
thiserror.workspace = true

[lints]
workspace = true
