# Lince Cargo workspace (ADR-0001, ADR-0002, docs/04-rust-architecture.md §2 and §7).

[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "xtask"]
# Proofs of concept are standalone crates with their own lockfiles; never workspace members.
exclude = ["poc"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Shared dependency versions; crates opt in with `<name>.workspace = true` (DEV-80 lists why).
[workspace.dependencies]
thiserror = "2.0.21"                 # error enums in library crates (DEV-20, PAT-01)
rustix = { version = "1.1.6", features = ["mm", "param"] }   # unix host memory (lince-mem, doc 04 §8)
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }   # windows host memory (lince-mem)

# docs/conventions/lints.md — every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"                 # allowed per crate with #![allow(unsafe_code)] — ARCH-24 crates only
unsafe_op_in_unsafe_fn = "deny"      # DEV-40
missing_docs = "warn"                # DEV-74
unreachable_pub = "warn"             # STRUCT-05
rust_2018_idioms = { level = "warn", priority = -1 }
let_underscore_drop = "warn"         # QUAL-41
static_mut_refs = "deny"             # QUAL-51

[workspace.lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Safety and panics
undocumented_unsafe_blocks = "deny"  # DEV-41: every unsafe block has // SAFETY:
missing_safety_doc = "deny"          # DEV-42
unwrap_used = "deny"                 # QUAL-44 (tests allowed via clippy.toml)
todo = "deny"                        # QUAL-43
unimplemented = "deny"               # QUAL-43
dbg_macro = "deny"                   # QUAL-43
print_stdout = "deny"                # QUAL-43 (tools opt out locally)
print_stderr = "deny"

# Structure and readability
wildcard_enum_match_arm = "warn"     # QUAL-22
fn_params_excessive_bools = "deny"   # QUAL-05
struct_excessive_bools = "warn"
excessive_nesting = "deny"           # QUAL-02 (threshold in clippy.toml)
too_many_lines = "deny"              # QUAL-04 (threshold in clippy.toml)
mod_module_files = "deny"            # STRUCT-02: forbids mod.rs
wildcard_imports = "deny"            # STRUCT-06
self_named_module_files = "allow"    # foo.rs + foo/ is the chosen style

# Types and casts
cast_possible_truncation = "deny"    # QUAL-23
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
large_types_passed_by_value = "warn" # QUAL-35
large_stack_arrays = "warn"

# Pedantic lints we deliberately relax
module_name_repetitions = "allow"    # conflicts with re-export style in lib.rs
must_use_candidate = "allow"         # noisy; use #[must_use] deliberately
missing_errors_doc = "allow"         # error enums document themselves (PAT-01)

# Profiles (docs/04-rust-architecture.md §7).
[profile.dev]
opt-level = 1
debug-assertions = true

[profile.release]
lto = "thin"
codegen-units = 16

# Release plus debug symbols. Frame pointers cannot be set per profile on stable Rust;
# build with RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling.
[profile.profiling]
inherits = "release"
debug = true

# Distribution builds (PGO later).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
