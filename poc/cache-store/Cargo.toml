[package]
name = "poc-cache-store"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "PoC-6: persistent cache store prototype and benchmark harness"
# tests/support.rs is a shared module, not a test crate of its own.
autotests = false

[[test]]
name = "engines"
path = "tests/engines.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "second_process"
path = "tests/second_process.rs"

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
memmap2 = "0.9.12"
redb = "4.5.0"
rusqlite = { version = "0.42.0", features = ["bundled"], optional = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
let_underscore_drop = "warn"
static_mut_refs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "warn"
excessive_nesting = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
wildcard_imports = "deny"
self_named_module_files = "allow"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
